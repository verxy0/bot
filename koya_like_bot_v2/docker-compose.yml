services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koya}
      POSTGRES_USER: ${POSTGRES_USER:-koya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  postgres_data:

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://koya:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-koya}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change_this_internal_key}
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
